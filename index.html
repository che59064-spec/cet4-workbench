<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CET-4 四级备考工作台</title>
<style>
:root{
  --primary:#00F5D4; --primary-dark:#00d0b4; --primary-light:rgba(0,245,212,.13);
  --bg:#08090B; --card:#0E1014; --card2:#13161C; --text:#E8ECEF; --muted:#8A9099;
  --border:#1A1D22; --border2:#262A31; --ok:#34E0A4; --warn:#F4D28A; --danger:#FF5C6A;
  --radius:14px; --shadow:0 14px 40px rgba(0,0,0,.38);
  --glow:rgba(0,245,212,.14); --tone-blue:#2442ff; --tone-cyan:#73a7ff; --tone-mint:#9cffdf;
}
html{color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","HarmonyOS Sans SC","Inter",-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2A2E35;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3a4049}
::selection{background:rgba(0,245,212,.24)}

.app{display:flex;min-height:100vh}
/* ===== 侧边栏 ===== */
.sidebar{width:232px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;padding:20px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2f6fed,#5b8def);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 12px rgba(47,111,237,.3)}
.brand h1{font-size:17px;line-height:1.2}
.brand p{font-size:11px;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:14px;color:#4a5568;transition:.15s;text-align:left}
.nav-item:hover{background:#f0f4fb;color:var(--primary)}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.nav-item .ico{font-size:17px;width:22px;text-align:center}
.side-foot{font-size:11px;color:#a8b0bd;text-align:center;padding:12px 0 2px}

/* ===== 主区域 ===== */
.main{flex:1;margin-left:232px;padding:26px 30px 40px;max-width:1080px}
.view{display:none;animation:fadeIn .25s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-head h2{font-size:22px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.date-chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card+.card{margin-top:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* 统计 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:flex;align-items:center;gap:14px}
.stat-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.stat-num{font-size:22px;font-weight:700;line-height:1.2}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.panel-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.chart-wrap{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:70%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#5b8def,#2f6fed);min-height:2px;transition:.3s;position:relative}
.bar:hover{opacity:.85}
.bar-val{font-size:10px;color:var(--muted)}
.bar-label{font-size:11px;color:var(--muted)}
.ring-row{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring .ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ring-text b{font-size:20px}
.ring .ring-text span{font-size:10px;color:var(--muted)}
.ring-item{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.timer-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer-num{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--primary);letter-spacing:1px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:500;transition:.15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{border:1px solid var(--border);color:#4a5568;background:var(--card)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-blue{background:var(--primary-light);color:var(--primary)}
.badge-green{background:#e6f7ef;color:var(--ok)}
.badge-orange{background:#fdf3e0;color:var(--warn)}
.badge-red{background:#fdeaea;color:var(--danger)}

/* 记录列表 */
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px}
.rec-item .rtype{font-weight:600}
.rec-empty{color:var(--muted);text-align:center;padding:22px 0;font-size:13px}

/* ===== 单词本 ===== */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--border);border-radius:10px;outline:none;background:var(--card);transition:.15s}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
.search-box .s-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--muted)}
.sort-group{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.sort-btn{padding:9px 14px;font-size:13px;color:var(--muted);transition:.15s}
.sort-btn.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.add-form{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:grid;grid-template-columns:1fr 1fr 2fr 110px auto;gap:10px;margin-bottom:16px;align-items:center}
.add-form input,.add-form select{padding:9px 12px;border:1px solid var(--border);border-radius:9px;outline:none;width:100%}
.add-form input:focus,.add-form select:focus{border-color:var(--primary)}
.add-form .af-title{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.word-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.word-card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;transition:.15s}
.word-card:hover{border-color:#c9d6f5;box-shadow:0 4px 16px rgba(31,42,68,.1)}
.wc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.wc-word{font-size:17px;font-weight:700;color:var(--primary-dark)}
.wc-phonetic{font-size:12px;color:var(--muted);margin:2px 0 6px}
.wc-meaning{font-size:13px;color:#3a4556;line-height:1.55}
.wc-phrases{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.phrase-chip{font-size:11px;background:var(--primary-light);color:var(--primary);padding:2px 9px;border-radius:14px}
.wc-example{font-size:12.5px;color:#4a5568;line-height:1.65;margin-top:8px;font-style:italic}
.wc-example span{font-style:normal;color:var(--muted);display:block;font-size:11.5px;margin-top:1px}
.mem-example{font-size:13px;color:#4a5568;line-height:1.7;font-style:italic;max-width:520px}
.mem-example span{font-style:normal;color:var(--muted);font-size:12px}
.wc-freq{margin-top:6px;font-size:11px;color:var(--warn);letter-spacing:2px}
.mastery-row{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.m-chip{font-size:11px;padding:4px 10px;border-radius:16px;border:1px solid var(--border);color:var(--muted);transition:.15s}
.m-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.m-chip:hover{border-color:var(--primary);color:var(--primary)}
.m-chip.active:hover{color:#fff}
.del-btn{font-size:11px;color:#b8bfcc;transition:.15s;padding:4px 6px}
.del-btn:hover{color:var(--danger)}
.word-count{font-size:12px;color:var(--muted);margin-bottom:10px}

/* ===== 背诵模式 ===== */
.mem-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.mem-bar select{padding:8px 12px;border:1px solid var(--border);border-radius:9px;outline:none;background:var(--card);font-size:13px}
.mem-bar .mb-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.mem-bar .mb-spacer{flex:1}
.mem-progress{height:8px;background:#eef1f7;border-radius:6px;overflow:hidden;margin-bottom:16px}
.mem-progress i{display:block;height:100%;background:linear-gradient(90deg,#5b8def,#2f6fed);border-radius:6px;transition:.3s}
.mem-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-bottom:10px}
.mem-card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 8px 30px rgba(31,42,68,.08);padding:44px 28px;text-align:center;min-height:290px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;cursor:pointer;transition:.15s}
.mem-card:hover{border-color:#c9d6f5}
.mem-word{font-size:38px;font-weight:800;color:var(--primary-dark);letter-spacing:.5px;word-break:break-word;line-height:1.3}
.mem-phonetic{font-size:16px;color:var(--muted)}
.mem-meaning{font-size:19px;color:#2c3648;line-height:1.7}
.mem-hint{font-size:13px;color:#a8b0bd}
.mem-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.mem-btn{padding:11px 26px;border-radius:12px;font-size:14px;font-weight:600;transition:.15s;color:#fff;display:inline-flex;align-items:center;gap:6px}
.mem-btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.mem-btn .kbd{font-size:11px;opacity:.75;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:1px 5px}
.mem-btn.gray{background:#8a93a3}
.mem-btn.orange{background:var(--warn)}
.mem-btn.green{background:var(--ok)}
.mem-kbd{font-size:11.5px;color:#a8b0bd;text-align:center;margin-top:14px}
.mem-result{text-align:center;padding:22px 10px}
.mem-result h3{font-size:20px;margin-bottom:12px}
.mem-result p{color:#4a5568;line-height:1.8}

/* ===== 听力 / 阅读 ===== */
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.set-card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:18px;cursor:pointer;transition:.15s}
.set-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 6px 18px rgba(31,42,68,.1)}
.set-card h4{font-size:15px;margin-bottom:6px}
.set-card p{font-size:12px;color:var(--muted);line-height:1.6}
.playbar{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.play-btn{width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(47,111,237,.35);transition:.15s;flex-shrink:0}
.play-btn:hover{background:var(--primary-dark);transform:scale(1.05)}
.play-btn.playing{background:var(--danger)}
.script-text{font-size:13px;color:#4a5568;line-height:1.7;flex:1;max-height:88px;overflow:auto}
.q-list{display:flex;flex-direction:column;gap:16px}
.q-item{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:18px}
.q-text{font-size:14px;font-weight:600;margin-bottom:12px;line-height:1.6}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.13s;font-size:13.5px;line-height:1.5}
.opt:hover{border-color:var(--primary);background:#f7faff}
.opt.selected{border-color:var(--primary);background:var(--primary-light)}
.opt.correct{border-color:var(--ok);background:#eefaf3}
.opt.wrong{border-color:var(--danger);background:#fdf0f0}
.opt .k{font-weight:700;color:var(--primary);flex-shrink:0}
.opt.correct .k{color:var(--ok)}
.opt.wrong .k{color:var(--danger)}
.q-analysis{font-size:13px;color:var(--muted);background:#f7f9fc;border-radius:10px;padding:12px;margin-top:12px;line-height:1.7;display:none}
.q-analysis.show{display:block}
.q-analysis b{color:var(--ok)}
.result-banner{background:linear-gradient(135deg,#2f6fed,#5b8def);color:#fff;border-radius:12px;padding:18px 22px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:0 6px 20px rgba(47,111,237,.25)}
.result-banner .score{font-size:28px;font-weight:800}
.article{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:24px;margin-bottom:18px;line-height:1.95;font-size:14.5px;color:#2c3648}
.article h3{font-size:17px;margin-bottom:12px;color:var(--primary-dark)}
.article p{margin-bottom:12px;text-align:justify}

/* ===== 写作 ===== */
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.cat-tab{padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:13px;color:#4a5568;transition:.15s}
.cat-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.tpl-card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:18px;cursor:pointer;transition:.15s}
.tpl-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.tpl-card h4{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.tpl-card .tpl-desc{font-size:12.5px;color:var(--muted);line-height:1.6}
.tpl-detail{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:24px}
.tpl-detail h3{margin-bottom:14px;font-size:17px}
.tpl-block{margin-bottom:18px}
.tpl-block h5{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.tpl-block .box{background:#f7f9fc;border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-size:13.5px;line-height:1.9;white-space:pre-wrap;color:#33405a}
.copy-btn{margin-top:6px}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-size:13px;margin-bottom:14px;padding:6px 0}

/* ===== 模拟考试 ===== */
.exam-hero{background:linear-gradient(135deg,#2f6fed,#5b8def);border-radius:16px;padding:26px 28px;color:#fff;box-shadow:0 8px 24px rgba(47,111,237,.3);margin-bottom:18px}
.exam-hero h3{font-size:22px;margin-bottom:8px}
.exam-hero p{font-size:13px;opacity:.92;line-height:1.7}
.exam-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.exam-timer-bar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;box-shadow:var(--shadow)}
.exam-timer-num{font-size:22px;font-weight:800;color:var(--danger);font-variant-numeric:tabular-nums;letter-spacing:1px}
.exam-timer-lbl{font-size:12px;color:var(--muted)}
.exam-section-title{font-size:16px;font-weight:700;margin:22px 0 12px;display:flex;align-items:center;gap:8px;color:var(--primary-dark)}
.exam-writing{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.exam-writing textarea{width:100%;min-height:180px;border:1px solid var(--border);border-radius:10px;padding:12px;outline:none;resize:vertical;font-size:14px;line-height:1.8;box-sizing:border-box}
.exam-writing textarea:focus{border-color:var(--primary)}
.exam-score-hero{background:linear-gradient(135deg,#2f6fed,#5b8def);border-radius:16px;padding:26px;color:#fff;text-align:center;margin-bottom:18px;box-shadow:0 8px 24px rgba(47,111,237,.3)}
.exam-score-hero .big{font-size:48px;font-weight:800;line-height:1.2}
.exam-score-hero .tag{display:inline-block;margin-top:10px;padding:5px 18px;border-radius:20px;background:rgba(255,255,255,.22);font-size:13px;font-weight:600}
.exam-score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.exam-score-card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px;text-align:center}
.exam-score-card .n{font-size:24px;font-weight:800;color:var(--primary)}
.exam-score-card .l{font-size:12px;color:var(--muted);margin-top:4px}
.exam-warn{background:#fdf3e0;border:1px solid #f3ddb0;border-radius:10px;padding:12px 14px;font-size:13px;color:#8a6420;line-height:1.7;margin-bottom:18px}

/* 移动端 tabbar */
.tabbar{display:none}

/* 响应式 */
@media(max-width:900px){
  .sidebar{display:none}
  .main{margin-left:0;padding:18px 14px 84px}
  .dash-grid{grid-template-columns:1fr}
  .add-form{grid-template-columns:1fr 1fr}
  .add-form .af-title{grid-column:1/-1}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);z-index:60;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10px;color:var(--muted);border-radius:10px;transition:.15s}
  .tab-item.active{color:var(--primary);font-weight:600}
  .tab-item .ico{font-size:19px}
  .stats-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .add-form{grid-template-columns:1fr}
  .word-list{grid-template-columns:1fr}
  .tpl-grid{grid-template-columns:1fr}
  .set-grid{grid-template-columns:1fr}
  .stat-num{font-size:18px}
  .mem-word{font-size:27px}
  .mem-card{min-height:230px;padding:32px 18px}
  .mem-btn{padding:10px 16px;font-size:13px}
}
/* ===== Mineradio 深色电台皮肤 ===== */
body{background:radial-gradient(1200px 600px at 90% -15%,rgba(36,66,255,.20),transparent 62%),radial-gradient(950px 540px at -10% 110%,rgba(0,245,212,.10),transparent 58%),var(--bg)}

/* ===== 真折射玻璃按钮（React Bits GlassSurface 原生移植） ===== */
.gs-ready{position:relative;isolation:isolate;transition:transform .16s ease,box-shadow .16s ease}
.gs-ready::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:2;
  background:linear-gradient(150deg,rgba(255,255,255,.62),rgba(255,255,255,.10) 42%,rgba(255,255,255,.04) 62%,rgba(255,255,255,.42));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.gs-ready::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:linear-gradient(135deg,rgba(255,255,255,.22) 0%,transparent 44%,transparent 66%,rgba(255,255,255,.08) 100%)}
.gs-ready:hover{transform:translateY(-1px)}
.gs-ready:active{transform:translateY(0) scale(.985)}
.gs-nofx::before,.gs-nofx::after{display:none}

/* ================= 数据种子 ================= */

let LISTENING_SETS = [
 {id:"L1", title:"短对话 · 图书馆借书", tag:"短对话",
  audio:"W: Good morning. Can I help you?\nM: Yes, I'd like to return these books.\nW: Let me check... I'm sorry, you have two overdue books, so you need to pay a fine.\nM: How much is it?\nW: Five dollars in total.\nM: That's fine. By the way, could you tell me where I can find books on English literature?\nW: Sure. They are on the third floor, Section D.\nM: Thank you very much.\nW: You're welcome.",
  questions:[
   {q:"Where does the conversation most probably take place?", options:["In a bookstore","In a library","In a classroom","In a post office"], answer:1, analysis:"根据对话内容（还书、逾期罚款、书架位置），可判断发生在图书馆。"},
   {q:"What problem does the man have?", options:["He lost a book","He returned the wrong books","His books are overdue","He forgot his library card"], answer:2, analysis:"图书管理员说 'you have two overdue books'，说明男生的书逾期未还。"},
   {q:"How much fine does the man need to pay?", options:["Three dollars","Five dollars","Ten dollars","Fifteen dollars"], answer:1, analysis:"原文明确提到 'Five dollars in total'，罚款共5美元。"},
   {q:"Where can the man find English literature books?", options:["On the first floor","On the second floor","On the third floor, Section D","On the fourth floor"], answer:2, analysis:"管理员回答 'They are on the third floor, Section D'。"}
  ]},
 {id:"L2", title:"短文 · 大学生睡眠与健康", tag:"短文",
  audio:"A recent survey shows that many university students do not get enough sleep. Experts say that sleeping less than seven hours a night can affect memory and concentration. They suggest that students should keep a regular schedule and avoid using phones before bedtime. Exercise is also important, but it should not be done too late in the evening. With these habits, students can improve both their health and their academic performance.",
  questions:[
   {q:"What does the survey show?", options:["Students eat too much","Many students do not get enough sleep","Students like watching TV","Students exercise too often"], answer:1, analysis:"开头即指出 'many university students do not get enough sleep'。"},
   {q:"What may happen if students sleep less than seven hours a night?", options:["They may gain weight","Their memory and concentration may be affected","They may become stronger","Nothing will happen"], answer:1, analysis:"文中提到睡眠不足 'can affect memory and concentration'。"},
   {q:"What suggestion is given about phones?", options:["Use them in the morning","Avoid using them before bedtime","Take them to class","Keep them on at night"], answer:1, analysis:"专家建议 'avoid using phones before bedtime'。"},
   {q:"What does the speaker say about exercise?", options:["It is not important","It should not be done too late in the evening","It should be avoided completely","It should be done very late"], answer:1, analysis:"原文 'it should not be done too late in the evening'，即晚上太晚不宜运动。"}
  ]},
 {id:"L3", title:"长对话 · 求职面试", tag:"长对话",
  audio:"M: Good morning. I'm here for the interview for the marketing position.\nW: Nice to meet you. Please have a seat. Can you tell me a little about yourself?\nM: Sure. I graduated from university last year with a degree in business. I have been working as a sales assistant for eight months.\nW: That sounds good. Why do you want to join our company?\nM: Your company has an excellent reputation, and I believe I can grow both professionally and personally here.\nW: What is your greatest strength?\nM: I am good at communicating with people and I never give up easily.\nW: Do you have any questions for us?\nM: Yes. Could you tell me about the training program for new employees?\nW: Of course. We offer a two-week training course, and a mentor will guide you during your first month.\nM: That's great. Thank you for your time.",
  questions:[
   {q:"What position is the man applying for?", options:["Sales assistant","Marketing position","Training manager","Business analyst"], answer:1, analysis:"对话开头即说明 'the interview for the marketing position'，他应聘的是市场岗位。"},
   {q:"How long has the man worked as a sales assistant?", options:["Six months","One year","Eight months","Two weeks"], answer:2, analysis:"他提到 'I have been working as a sales assistant for eight months'，已工作八个月。"},
   {q:"What does the man say is his greatest strength?", options:["He is good at communicating with people","He is good at math","He can speak three languages","He has a master's degree"], answer:0, analysis:"他回答 'I am good at communicating with people and I never give up easily'，善于沟通。"},
   {q:"What training program does the woman mention?", options:["A one-week course","A one-month course","A two-month course","A two-week training course"], answer:3, analysis:"她介绍 'We offer a two-week training course'，为期两周的培训课程。"}
  ]},
 {id:"L4", title:"新闻 · 欧洲高温创纪录", tag:"新闻报道",
  audio:"Scientists in Europe have reported that the summer of 2025 was the hottest on record. The rising temperatures have caused serious problems, including forest fires and water shortages. To deal with this, many cities are planting more trees and building green roofs. Researchers also remind people to save energy at home, such as turning off lights and using public transportation. They say that small everyday actions, when combined, can make a big difference to the environment.",
  questions:[
   {q:"What did scientists report about the summer of 2025?", options:["It was the wettest summer","It was the hottest on record","It was the coldest summer","It was quite normal"], answer:1, analysis:"新闻报道开头：'the summer of 2025 was the hottest on record'。"},
   {q:"Which problem is mentioned as caused by rising temperatures?", options:["Snowstorms and typhoons","Earthquakes and floods","Forest fires and water shortages","Heavy rain"], answer:2, analysis:"文中列举 'forest fires and water shortages'（森林火灾与水资源短缺）。"},
   {q:"What are many cities doing to deal with the problem?", options:["Building more factories","Using more air conditioners","Cutting down forests","Planting more trees and building green roofs"], answer:3, analysis:"原文 'many cities are planting more trees and building green roofs'。"},
   {q:"What do researchers suggest people do at home?", options:["Use more electricity","Save energy, such as turning off lights","Drive more","Keep the heating on all night"], answer:1, analysis:"他们提醒 'save energy at home, such as turning off lights'，即随手关灯节能。"}
  ]},
 {id:"L5", title:"长对话 · 新学期选课", tag:"长对话",
  audio:"M: Hi, Jane. Have you decided which courses to take next semester?\nW: Not yet. I'm thinking about an art history course, but I heard it's quite demanding.\nM: It is. I took it last year, and we had to visit museums every weekend and write two long papers.\nW: That sounds time-consuming. Maybe I should choose something lighter, like Introduction to Psychology.\nM: That one is popular and not too difficult. But the seats fill up quickly, so you'd better register early.\nW: Good point. When does registration start?\nM: Next Monday at nine in the morning, online.\nW: Thanks for the advice. I'll be ready.",
  questions:[
   {q:"What is the woman planning to do?", options:["Visit a museum","Choose courses for next semester","Write a paper","Register for a job"], answer:1, analysis:"对话开头女方问 'which courses to take next semester'，她在为下学期选课。"},
   {q:"What did the man say about the art history course?", options:["It is very easy","It is demanding, with weekend museum visits and two long papers","It has been cancelled","It is only available online"], answer:1, analysis:"男方说他上过该课，需要 'visit museums every weekend and write two long papers'，比较费力。"},
   {q:"Which course does the man suggest instead?", options:["Introduction to Psychology","Art History","Computer Science","Economics"], answer:0, analysis:"男方推荐 'Introduction to Psychology'，认为它热门且难度适中。"},
   {q:"When does the registration start?", options:["Next Friday","Today","Next Monday at nine in the morning, online","Next month"], answer:2, analysis:"男方告知 'Next Monday at nine in the morning, online'，下周一上午九点线上选课。"}
  ]},
 {id:"L6", title:"新闻 · 亲近自然有益心理健康", tag:"新闻报道",
  audio:"A new study published in a health journal suggests that spending at least two hours a week in nature can greatly improve people's mental health. The researchers followed about twenty thousand adults and found that those who walked in parks, forests or along rivers reported lower levels of stress and anxiety. Interestingly, it does not matter how the time is spent — sitting, walking or cycling all work. The scientists hope that city planners will create more green spaces so that everyone can enjoy these benefits.",
  questions:[
   {q:"What does the new study suggest?", options:["Spending at least two hours a week in nature improves mental health","People should stay indoors more","Exercise is harmful to health","City life is better than country life"], answer:0, analysis:"研究指出每周在自然中度过至少两小时 'can greatly improve people's mental health'。"},
   {q:"How many adults did the researchers follow?", options:["Two thousand","About twenty thousand","Twelve thousand","Two hundred thousand"], answer:1, analysis:"原文 'followed about twenty thousand adults'，约两万名成年人。"},
   {q:"According to the study, which way of spending time in nature works best?", options:["Only running","Only cycling","Only sitting","Sitting, walking or cycling all work"], answer:3, analysis:"研究强调 'it does not matter how the time is spent'，静坐、散步或骑行都有效。"},
   {q:"What do the scientists hope city planners will do?", options:["Build more houses","Cut down trees","Create more green spaces","Build more roads"], answer:2, analysis:"科学家希望城市规划者 'create more green spaces'，让所有人受益。"}
  ]},
 {id:"L7", title:"短文 · 拖延症与时间管理", tag:"短文",
  audio:"Do you often put off your homework until the night before it is due? If so, you are not alone. According to a survey, about seventy percent of college students admit that they procrastinate. Psychologists say procrastination is usually caused by fear of failure or by feeling overwhelmed. To fight it, they suggest breaking a large task into small steps and rewarding yourself after finishing each step. Starting with just five minutes of work is often enough to overcome the initial resistance.",
  questions:[
   {q:"What percentage of college students admit that they procrastinate?", options:["Forty percent","Seventy percent","Ninety percent","Thirty percent"], answer:1, analysis:"调查显示约 70% 的大学生承认自己拖延。"},
   {q:"According to psychologists, what usually causes procrastination?", options:["Fear of failure or feeling overwhelmed","Pure laziness","Getting too much sleep","Lack of money"], answer:0, analysis:"心理学家认为拖延通常源于对失败的恐惧或感到压力过大。"},
   {q:"What suggestion do they give to fight procrastination?", options:["Do everything at the last minute","Break a large task into small steps and reward yourself","Avoid all homework","Work alone all night"], answer:1, analysis:"建议把大任务拆成小步骤，每完成一步给自己奖励。"},
   {q:"Why is starting with just five minutes of work helpful?", options:["It finishes the whole task","It is enough to overcome the initial resistance","It impresses the teacher","It is the only way to study"], answer:1, analysis:"只先做五分钟往往就能克服开始时的抗拒心理。"}
  ]},
 {id:"L8", title:"长对话 · 预订酒店房间", tag:"长对话",
  audio:"W: Good afternoon, City Hotel. How can I help you?\nM: Hi, I'd like to book a double room for three nights, from the fifteenth to the eighteenth.\nW: Let me check... Yes, we have rooms available. Would you like a room with a sea view?\nM: How much more is the sea view?\nW: It's twenty dollars more per night.\nM: I'll take the standard one, please. By the way, does the price include breakfast?\nW: Yes, breakfast is included from seven to ten in the morning.\nM: Great. What time is check-out?\nW: Twelve o'clock noon. May I have your name and phone number, please?\nM: Sure. It's David Brown.",
  questions:[
   {q:"Where does the conversation most probably take place?", options:["In a restaurant","At a hotel reception","In a travel agency","On a plane"], answer:1, analysis:"女方自报 'City Hotel' 并询问订房需求，应发生在酒店前台。"},
   {q:"How many nights does the man want to book?", options:["Two nights","Three nights","Four nights","Five nights"], answer:1, analysis:"男方要订 'three nights, from the fifteenth to the eighteenth'。"},
   {q:"Which room does the man finally choose?", options:["A room with a sea view","A standard room","A luxury suite","A single room"], answer:1, analysis:"得知海景房每晚贵 20 美元后，他选择 'the standard one'。"},
   {q:"What time is check-out?", options:["Ten in the morning","Eleven in the morning","Twelve o'clock noon","Two in the afternoon"], answer:2, analysis:"前台回答退房时间是中午十二点。"}
  ]},
 {id:"L9", title:"短对话 · 邮局寄包裹", tag:"短对话",
  audio:"W: Next, please. How can I help you?\nM: I'd like to send this package to Shanghai by express mail.\nW: Sure. Could you fill in this form first? Please write the receiver's address clearly.\nM: No problem. How long will it take to arrive?\nW: About two days by express.\nM: And how much does it cost?\nW: Fifty yuan for a package under one kilogram. Yours is eight hundred grams, so fifty yuan.\nM: OK. Here is the form and the money.",
  questions:[
   {q:"Where does the conversation most probably take place?", options:["In a bookstore","In a post office","In a bank","In a school"], answer:1, analysis:"寄包裹、填单、按重量计费，是典型的邮局场景。"},
   {q:"Where is the man sending the package?", options:["Beijing","Shanghai","Guangzhou","Shenzhen"], answer:1, analysis:"他明确说 'send this package to Shanghai'。"},
   {q:"How long will the package take to arrive?", options:["About two days","About two weeks","On the same day","About a month"], answer:0, analysis:"快递大约两天到达 'About two days by express'。"},
   {q:"How much does the man need to pay?", options:["Thirty yuan","Forty yuan","Fifty yuan","Sixty yuan"], answer:2, analysis:"一公斤以内快递 50 元，他的包裹 800 克，正好 50 元。"}
  ]},
 {id:"L10", title:"短文 · 珍惜淡水资源", tag:"短文",
  audio:"Water is one of the most precious resources on the earth. Although about seventy percent of the earth's surface is covered with water, most of it is salt water. The fresh water that people can use is very limited. Scientists warn that many cities may face serious water shortage in the future. Luckily, everyone can help. Turning off the tap while brushing teeth, taking shorter showers and fixing leaking pipes are simple but effective ways. Besides, collecting rainwater for watering plants is also a good idea. If we save a little every day, we can make a real difference.",
  questions:[
   {q:"What does the speaker say about water on the earth?", options:["Most water on the earth is fresh water","Most of the water is salt water and fresh water is limited","There is no water shortage at all","The oceans are full of fresh water"], answer:1, analysis:"地球表面 70% 是水，但多为海水，可用淡水非常有限。"},
   {q:"What do scientists warn about?", options:["Many cities may face serious water shortage","The sea level is falling","Fish are dying in rivers","Rain is becoming more salty"], answer:0, analysis:"科学家警告未来许多城市可能面临严重缺水。"},
   {q:"Which of the following is NOT mentioned as a way to save water?", options:["Turning off the tap while brushing teeth","Taking shorter showers","Fixing leaking pipes","Boiling water before drinking"], answer:3, analysis:"文中提到关水龙头、缩短淋浴、修漏水管与收集雨水，未提'烧开水'。"},
   {q:"What is the main purpose of this passage?", options:["To describe how rain is formed","To call on people to save water","To introduce ocean animals","To sell water purifiers"], answer:1, analysis:"全文列举节水方法，号召大家从日常小事节约用水。"}
  ]},
 {id:"L11", title:"长对话 · 咨询健身房会员", tag:"长对话",
  audio:"W: Hello, Sunshine Fitness Center. How may I help you?\nM: Hi. I'd like to know about your membership plans.\nW: We have monthly, quarterly and yearly plans. The yearly one is the most popular.\nM: How much is the yearly plan?\nW: One thousand two hundred yuan, and it includes all group classes.\nM: Are the facilities open at weekends?\nW: Yes, from eight in the morning to ten in the evening every day.\nM: Sounds good. Can I visit the center first before I decide?\nW: Of course. We offer a free trial day. Just bring your ID.",
  questions:[
   {q:"What is the man calling about?", options:["Booking a personal trainer","Asking about membership plans","Complaining about the service","Cancelling his membership"], answer:1, analysis:"他来电是想了解健身房会员方案。"},
   {q:"How much does the yearly plan cost?", options:["Eight hundred yuan","One thousand yuan","One thousand two hundred yuan","Two thousand yuan"], answer:2, analysis:"年卡 1200 元，且包含所有团体课程。"},
   {q:"What are the weekend opening hours?", options:["Eight in the morning to ten in the evening","Nine to five","Ten to eight","Closed on weekends"], answer:0, analysis:"健身房每天早八点到晚十点开放，周末也一样。"},
   {q:"What does the woman offer the man?", options:["A discount card","A free trial day","A free T-shirt","A personal coach"], answer:1, analysis:"她提供免费体验日，带上身份证即可。"}
  ]},
 {id:"L12", title:"新闻 · 城市电动公交车", tag:"新闻报道",
  audio:"A city in southern China has put two hundred electric buses into service this year. The buses are quiet, produce no exhaust gas and cost less to run than traditional ones. The city plans to replace all old buses with electric models in the next five years. Local residents say they are happy with the cleaner air and the smoother ride. Environmental experts believe that such moves will greatly reduce carbon emissions and encourage other cities to follow the example.",
  questions:[
   {q:"How many electric buses has the city put into service this year?", options:["One hundred","Two hundred","Three hundred","Five hundred"], answer:1, analysis:"新闻称该市今年投放了 200 辆电动公交车。"},
   {q:"Which is an advantage of electric buses mentioned in the news?", options:["They are quiet and produce no exhaust gas","They run faster than trains","They are more expensive to run","They make more noise"], answer:0, analysis:"电动公交车安静、零尾气、运行成本更低。"},

   {q:"What can even one night of poor sleep do?", options:["Make people smarter","Weaken attention and the ability to store new information","Improve memory greatly","Make people never feel tired"], answer:1, analysis:"哪怕一晚睡眠差也会削弱注意力与信息存储能力。"},

 {id:"R11", title:"China's Aging Population", tag:"社会民生",
  paragraphs:[
   "China's population is aging quickly. By 2035, experts predict that more than thirty percent of the population will be sixty years old or above. This change brings both challenges and opportunities.",
   "An aging society must care for more elderly people, which puts pressure on the pension system and hospitals. Meanwhile, fewer young workers may slow down economic growth, and many young couples have to take care of four aging parents.",
   "The government has taken measures such as raising the retirement age and improving community care services. New smart devices also help the elderly check their health at home. Above all, society should value the experience and wisdom of older people, who have much to teach the young."
  ],
  questions:[
   {q:"What is predicted to happen by 2035?", options:["The population will stop aging","Over thirty percent of people will be sixty or above","Young people will outnumber the elderly","Hospitals will close down"], answer:1, analysis:"专家预测到 2035 年 60 岁以上人口占比将超过 30%。"},
   {q:"Which is mentioned as a challenge of an aging society?", options:["More babies are born every year","Pressure on the pension system and hospitals","Young people have too much free time","There are too many workers"], answer:1, analysis:"老龄化给养老金体系与医院带来压力，年轻劳动力减少。"},
   {q:"Which measure has the government taken?", options:["Raising the retirement age and improving community care","Lowering the retirement age","Building fewer hospitals","Stopping all immigration"], answer:0, analysis:"政府采取提高退休年龄、完善社区养老服务等措施。"},
   {q:"How do smart devices help the elderly?", options:["They cook meals automatically","They help check health at home","They drive cars for them","They replace doctors completely"], answer:1, analysis:"智能设备帮助老人在家监测健康状况。"},
   {q:"What does the author emphasize about older people?", options:["They are a burden on society","Their experience and wisdom should be valued","They should never retire","They cannot learn new things"], answer:1, analysis:"作者强调应珍视老年人的经验与智慧，他们能教导年轻人。"}
  ]},
 {id:"R12", title:"Hanfu and Cultural Confidence", tag:"文化传统",
  paragraphs:[
   "Hanfu, the traditional clothing of the Han people, has become increasingly popular among young Chinese in recent years. On streets, in parks and on college campuses, more and more people wear it, and photos of hanfu flood social media platforms.",
   "For many wearers, hanfu means more than fashion. Putting on the flowing robes makes them feel connected to history and proud of Chinese culture, which experts call cultural confidence. Traditional festivals such as the Mid-Autumn Festival and wedding ceremonies are especially popular occasions for wearing hanfu.",
   "The trend has also boosted the economy. Sales of hanfu have risen sharply, and some local governments hold hanfu festivals to attract tourists. Although some people worry about the price and quality of certain products, the revival of hanfu is generally seen as a positive bridge between modern youth and ancient tradition."
  ],
  questions:[
   {q:"What is hanfu according to the passage?", options:["A modern sport","The traditional clothing of the Han people","A type of Chinese food","A pop music style"], answer:1, analysis:"hanfu 是汉民族的传统服饰。"},
   {q:"Why do many wearers choose hanfu?", options:["It is cheaper than other clothes","It makes them feel connected to history and proud of Chinese culture","It is required by law","It keeps them warm in winter only"], answer:1, analysis:"穿着汉服让人感到与历史相连、为中华文化自豪，即文化自信的体现。"},
   {q:"When do people especially like to wear hanfu?", options:["During traditional festivals and wedding ceremonies","Only when doing sports","At job interviews","On rainy days"], answer:0, analysis:"中秋等传统节日与婚礼场合尤其流行穿汉服。"},
   {q:"What has the trend brought to the economy?", options:["A sharp rise in hanfu sales and local hanfu festivals","Higher prices for all food","Fewer tourists","The closing of clothing stores"], answer:0, analysis:"汉服销售大涨，一些地方政府办汉服节吸引游客。"},
   {q:"How is the revival of hanfu generally viewed?", options:["As a negative trend","As a positive bridge between modern youth and ancient tradition","As a waste of money","As a foreign influence"], answer:1, analysis:"总体被视为连接现代青年与古老传统的积极桥梁。"}
  ]},
 {id:"R13", title:"Artificial Intelligence and Future Jobs", tag:"科技前沿",
  paragraphs:[
   "Artificial intelligence is developing at an amazing speed. It can already write reports, drive cars and answer customer questions. Many people worry that AI will take away their jobs, especially those that involve routine tasks such as data entry and simple bookkeeping.",
   "History, however, offers a different lesson. When machines replaced workers in the past, new kinds of jobs were created that no one could imagine before. Similarly, AI may free humans from boring work and allow them to focus on creative and caring tasks, such as designing, teaching and nursing.",
   "The key is to be ready for change. Experts advise workers to keep learning new skills throughout life. Abilities that machines find hard to copy — communication, empathy, creativity and solving complex problems — will become more valuable than ever."
  ],
  questions:[
   {q:"Why do many people worry about AI?", options:["Because AI will make life harder","Because AI may take over jobs that involve routine tasks","Because AI is too expensive","Because AI can only play games"], answer:1, analysis:"人们担心 AI 取代涉及重复性任务的岗位，如数据录入和记账。"},
   {q:"What lesson does history offer?", options:["Machines always cause unemployment forever","New kinds of jobs were created when old ones disappeared","Technology never changes society","People should fear machines"], answer:1, analysis:"历史上机器替代人力后创造了此前无法想象的新职业。"},
   {q:"What may AI free humans to do?", options:["Work longer hours","Focus on creative and caring tasks","Do more boring jobs","Replace all teachers"], answer:1, analysis:"AI 可把人类从枯燥劳动中解放出来，去做设计、教学、护理等创造性工作。"},
   {q:"Which ability is hard for machines to copy?", options:["Quick calculation","Storing large data","Communication, empathy and creativity","Scanning documents"], answer:2, analysis:"沟通、共情、创造力与解决复杂问题等能力是机器难以复制的。"},
   {q:"What is the author's attitude towards AI and jobs?", options:["Panic","Cautious but positive, emphasizing adaptation","Full of fear","Uninterested"], answer:1, analysis:"作者承认风险，但以历史视角说明机遇，强调终身学习与适应。"}
  ]},
 {id:"R14", title:"Low-Carbon Travel", tag:"环境保护",
  paragraphs:[
   "Transport is one of the biggest sources of carbon emissions. Every day, millions of cars burn fuel on city roads, releasing gases that warm the planet. Choosing greener ways to travel has therefore become an important part of protecting the environment.",
   "There are many low-carbon choices. Taking the bus or the subway produces far fewer emissions per person than driving alone. Cycling and walking are even better: they create no pollution at all and are good for health. Carpooling, or sharing a car with others going the same way, is another practical option.",
   "Many cities are helping by building more bicycle lanes, expanding the subway system and making buses run on clean energy. If every person changes just one short car trip into a walk or a bike ride each day, the total effect will be surprisingly large."
  ],
  questions:[
   {q:"Why is low-carbon travel important?", options:["Because transport is one of the biggest sources of carbon emissions","Because cars are too expensive","Because people dislike buses","Because roads are too narrow"], answer:0, analysis:"交通是碳排放最大来源之一，绿色出行成为环保重要一环。"},
   {q:"Which travel way creates no pollution at all?", options:["Driving alone","Cycling and walking","Taking a taxi","Flying"], answer:1, analysis:"骑行与步行零污染且有益健康。"},
   {q:"What does carpooling mean in the passage?", options:["Driving alone to work","Sharing a car with others going the same way","Selling cars","Building more roads"], answer:1, analysis:"carpooling 即拼车——与同路人共享一辆车。"},
   {q:"What are cities doing to help?", options:["Building more bicycle lanes and expanding the subway","Encouraging more private cars","Closing all bus lines","Raising fuel taxes only"], answer:0, analysis:"城市正建设更多自行车道、扩建地铁、让公交用清洁能源。"},
   {q:"What does the author call on people to do?", options:["Stop travelling completely","Change some short car trips into walks or bike rides","Buy bigger cars","Drive faster"], answer:1, analysis:"作者呼吁每天把一次短途驾车换成步行或骑行，积少成多。"}
  ]},
 {id:"R15", title:"The Danger of Sitting Too Much", tag:"健康生活",
  paragraphs:[
   "Modern life keeps us in chairs. We sit at desks for work, in front of screens for online classes, and on sofas for entertainment. Studies show that the average adult now sits for more than nine hours a day, and long periods of sitting can harm health even for people who exercise regularly.",
   "Too much sitting has been linked to weight gain, back pain and a higher risk of heart disease. When we sit for hours, the body burns fewer calories and blood sugar levels rise. Some researchers even call sitting 'the new smoking'.",
   "The good news is that small changes help. Standing desks allow people to work on their feet. Experts suggest taking a short walk every hour, stretching during breaks and choosing stairs instead of the elevator. Moving a little throughout the day matters more than one long workout."
  ],
  questions:[
   {q:"Why do modern people sit too much?", options:["Because they prefer standing","Because work, online classes and entertainment keep them seated","Because chairs are comfortable","Because doctors tell them to"], answer:1, analysis:"办公、网课、娱乐都让人久坐，平均每天坐超九小时。"},
   {q:"What can prolonged sitting cause?", options:["Weight gain, back pain and a higher risk of heart disease","Better eyesight","Stronger muscles","Longer life"], answer:0, analysis:"久坐与肥胖、背痛及心脏病风险上升有关。"},
   {q:"What do researchers mean by calling sitting 'the new smoking'?", options:["Sitting is as harmful as smoking","Sitting is a new sport","People should smoke instead","Sitting can cure diseases"], answer:0, analysis:"把久坐称为'新型吸烟'意在强调其对健康的危害之大。"},
   {q:"Which is NOT suggested to reduce sitting?", options:["Using standing desks","Taking a short walk every hour","Choosing stairs instead of the elevator","Working without any breaks"], answer:3, analysis:"建议包括站立办公、每小时走动、走楼梯，而'不休息连续工作'恰是应避免的。"},
   {q:"What matters more according to the experts?", options:["One long workout per week","Moving a little throughout the day","Never sitting at all","Sleeping at the desk"], answer:1, analysis:"专家认为全天分散的小幅活动比一次长时间锻炼更重要。"}
  ]},
 {id:"R16", title:"Teamwork in the Workplace", tag:"职场协作",
  paragraphs:[
   "Teamwork is highly valued by employers. In modern companies, tasks are often too complex for one person, so people with different skills must work together. A good team can finish work faster and come up with better ideas than any single member.",
   "Working in a team, however, is not always easy. Members may disagree, some may do less than their share, and sometimes everyone follows the first idea without thinking. Poor communication is usually at the root of these problems.",
   "Successful teams follow simple rules: each member has a clear role, everyone feels free to give feedback, and differences are respected. Celebrating small wins keeps the team motivated. In the end, a team that trusts each other will achieve far more than a group of talented individuals working alone."
  ],
  questions:[
   {q:"Why is teamwork valued by employers?", options:["Because tasks are too complex for one person and different skills are needed","Because teams need fewer people","Because individuals always fail","Because employers dislike hard workers"], answer:0, analysis:"现代企业任务复杂，需要不同技能的人协作完成。"},
   {q:"Which is mentioned as a problem in teams?", options:["Too many good ideas","Some members may do less than their share","Teams never disagree","Everyone works too hard"], answer:1, analysis:"团队常见问题包括意见分歧、有人搭便车少干活、盲目跟风。"},
   {q:"What is usually at the root of team problems?", options:["Poor communication","Lack of money","Bad weather","Old computers"], answer:0, analysis:"沟通不畅通常是团队问题的根源。"},
   {q:"Which rule helps successful teams?", options:["Everyone does the same job","Members feel free to give feedback","Only the leader can speak","Differences are punished"], answer:1, analysis:"成功团队中每人角色清晰、成员可自由反馈、尊重差异。"},
   {q:"What can be inferred from the last sentence?", options:["Trusting teams achieve more than talented individuals alone","Individuals never succeed","Teams are always slow","Talents are useless"], answer:0, analysis:"互相信任的团队成就远超单打独斗的优秀个人。"}
  ]}
];

const WRITING_TEMPLATES = [ {id:"W1", cat:"议论文", icon:"📝", title:"利弊分析型（The Pros and Cons）",

  tips:"万能开头：Nowadays, ... has become increasingly popular. 观点段用 On the one hand / On the other hand 展开。"},
 {id:"W2", cat:"议论文", icon:"📝", title:"观点论证型（My View on ...）",
  desc:"用于「你的看法是什么」类题目，结构为提出观点→论证→总结。",
  skeleton:"开头段：As is known to all / As is often the case, [现象]. Some people believe that [观点A], while others argue that [观点B]. As far as I am concerned, [我的观点].\n\n主体段1：First of all, [理由1]. Take ... as an example, [细节]. \n\n主体段2：Moreover, [理由2]. In addition, [理由3].\n\n结尾段：To sum up, [重申观点]. I firmly believe that [展望].",
  sample:"【范文：谈谈手机对生活的影响】\nAs is often the case, mobile phones have become an indispensable part of our daily life. Some people believe that they bring great convenience, while others argue that they cause many problems. As far as I am concerned, the benefits outweigh the drawbacks.\n\nFirst of all, mobile phones make communication much easier. We can contact our family and friends at any time, no matter where they are. Moreover, they provide access to information and online learning, which greatly enriches our knowledge.\n\nTo sum up, mobile phones play a positive role in our life if we use them properly. I firmly believe that with reasonable use, they will bring us more benefits than harm.",
  tips:"观点句放在开头段末尾，主体段用 First of all / Moreover 递进。"},
 {id:"W3", cat:"应用文", icon:"✉️", title:"书信模板（建议信 / 邀请信）",
  desc:"适用于写作 Part 1 的应用文，包括建议信、邀请信、感谢信、道歉信。",
  skeleton:"Dear [收信人],\n\nI am writing to [目的：offer some advice / invite you to ... / express my gratitude]. \n\nTo begin with, [要点1]. Besides, [要点2]. Last but not least, [要点3].\n\nI do hope my suggestions will be helpful / I would appreciate it if you could ... Looking forward to your reply.\n\nYours sincerely,\n[署名]",
  sample:"【范文：给朋友的建议信】\nDear Tom,\n\nI am writing to offer you some advice on how to prepare for the coming CET-4 examination.\n\nTo begin with, you should enlarge your vocabulary by memorizing 20 new words every day. Besides, listening practice twice a week will greatly improve your listening comprehension. Last but not least, try to write one composition every weekend and learn from the model essays.\n\nI do hope my suggestions will be helpful. Looking forward to your early reply.\n\nYours sincerely,\nLi Ming",
  tips:"书信格式：Dear + 称呼开头，Yours sincerely 结尾。三段式：目的→要点→期望。"},
 {id:"W4", cat:"应用文", icon:"✉️", title:"通知 / 公告模板（Notice）",
  desc:"校园活动通知、讲座公告等应用文写作。",
  skeleton:"Notice\n\nIn order to [目的], our [部门/组织] is going to hold [活动] on [时间] at [地点]. The details are as follows.\n\nFirst, [要求/安排1]. Second, [安排2]. Third, [安排3].\n\nAnyone who is interested is warmly welcome to participate. Please [报名方式].\n\nStudent Union\n[日期]",
  sample:"【范文：英语角活动通知】\nNotice\n\nIn order to help students improve their oral English, the Student Union is going to hold an English Corner activity on Friday evening at 7:00 p.m. in the Lecture Hall. The details are as follows.\n\nFirst, the activity will last about two hours. Second, an American teacher will be invited to share tips on oral communication. Third, students are encouraged to talk with each other in English freely.\n\nAnyone who is interested is warmly welcome to participate. Please sign up before Thursday at the Student Union office.\n\nStudent Union\nJune 10, 2026",
  tips:"标题 Notice 居中，正文用 First / Second / Third 罗列，落款署名+日期。"},
 {id:"W5", cat:"图表作文", icon:"📊", title:"图表作文模板（Data Description）",
  desc:"描述柱状图、饼图、表格数据并分析原因，近年来四级常考题型。",
  skeleton:"开头段：The [chart/table] above shows [图表主题]. According to the data, [总体趋势：the number of X increased steadily / decreased sharply from ... to ...].\n\n主体段1：To be specific, [具体数据描述]. For instance, [最大/最小数据]. This indicates that [结论].\n\n主体段2：Several factors may account for this trend. First, [原因1]. In addition, [原因2].\n\n结尾段：In conclusion, [总结]. It is expected that [未来趋势预测].",
  sample:"【范文：手机使用时长统计图】\nThe bar chart above shows the average time Chinese college students spend on mobile phones per day. According to the data, the figure increased steadily from 1.5 hours in 2019 to 4.2 hours in 2025.\n\nTo be specific, the biggest jump took place between 2023 and 2025, when the time almost doubled. This indicates that mobile phones have played an increasingly important role in students' daily life.\n\nSeveral factors may account for this trend. First, online courses and apps make phones necessary for learning. In addition, short videos and social media are highly attractive to young people.\n\nIn conclusion, mobile phones have become a double-edged sword. It is expected that students will learn to use them more wisely in the future.",
  tips:"第一句必须交代图表类型与主题，第二句写总体趋势，中间段务必引用具体数字。"},
 {id:"W6", cat:"翻译", icon:"🔤", title:"翻译常用句型（汉译英高频句型）",
  desc:"四级段落翻译常用句型与连接词，帮助组织句子。",
  skeleton:"【常见句型】\n1. ……是……的重要组成部分：... plays an important role in ... / ... is an important part of ...\n2. 随着……的发展：With the development of ..., ...\n3. 越来越……：... is becoming more and more ...\n4. 据统计：According to statistics / It is reported that ...\n5. 不仅……而且……：not only ... but also ...\n6. 人们普遍认为……：It is widely believed that ...\n7. 正因为如此：That is why ...\n8. 被广泛使用：be widely used in ...\n\n【常用连接词】\n表递进：besides, moreover, what's more\n表转折：however, on the contrary, nevertheless\n表因果：therefore, as a result, thanks to\n表举例：for example, such as, take ... as an example\n表总结：in a word, to sum up, in conclusion",
  sample:"【示例：翻译练习】\n原文：随着移动互联网的发展，网上购物越来越流行。据统计，2025年中国网上零售额超过了15万亿元。网上购物不仅方便快捷，而且价格相对便宜，正因如此，它受到了越来越多消费者的欢迎。\n\n参考译文：With the development of the mobile Internet, online shopping is becoming more and more popular. According to statistics, China's online retail sales exceeded 15 trillion yuan in 2025. Online shopping is not only convenient but also relatively cheap. That is why it is welcomed by more and more consumers.",
  tips:"先把主干（主谓宾）找出来，再套上 With the development of / not only...but also 等句型扩充。"},
 {id:"W7", cat:"议论文", icon:"📝", title:"问题解决型（Problem–Solution）",
  desc:"针对校园或社会问题：描述现象 → 分析原因 → 给出对策，四级高频题型。",
  skeleton:"开头段：Nowadays, [问题现象] has become a serious problem, which has aroused wide concern among [相关群体].\n\n主体段1（原因）：There are several reasons for this phenomenon. To begin with, [原因一]. What is more, [原因二].\n\n主体段2（对策）：Therefore, effective measures should be taken to solve it. First of all, [措施一]. In addition, [措施二]. Only in this way can we [目标].\n\n结尾段：In my opinion, if all of us take action right now, the situation will be improved in the near future.",
  sample:"Nowadays, a large number of college students seldom take physical exercise, which has aroused wide concern among teachers and parents.\n\nThere are several reasons for this phenomenon. To begin with, many students are occupied with their studies and part-time jobs. What is more, some of them prefer staying in the dormitory playing games to doing sports outdoors.\n\nTherefore, effective measures should be taken to solve it. First of all, universities should offer more interesting PE courses and organize colorful sports activities. In addition, students themselves should realize the importance of health and form the habit of regular exercise. Only in this way can we keep both physically and mentally healthy.\n\nIn my opinion, if all of us take action right now, the situation will be improved in the near future.",
  patterns:"Nowadays, ... has become a serious problem, which has aroused wide concern.\nThere are several reasons for this phenomenon.\nEffective measures should be taken to solve it.\nOnly in this way can we ...（倒装加分句）\nIf all of us take action, the situation will be improved.",
  keywords:"phenomenon 现象 / effective measures 有效措施 / arouse wide concern 引起广泛关注 / take action 采取行动 / be occupied with 忙于",
  pitfalls:"只罗列原因不写对策会严重丢分；措施必须具体（谁+做什么），避免空喊口号。"},
 {id:"W8", cat:"议论文", icon:"📝", title:"名言谚语型（Quote-based）",
  desc:"题目给出一句名言/谚语，要求谈理解：解释名言 → 举例论证 → 联系自身。",
  skeleton:"开头段：As the famous saying goes, “[名言]”. Simple as the remark may sound, it contains abundant life philosophy and tells us that [论点].\n\n主体段1：There is no denying that [解释一]. For example, [例子一].\n\n主体段2：Moreover, [解释二]. Take ... as an example, [细节展开].\n\n结尾段：To sum up, we should always keep the saying in mind. Only by doing so can we [升华：实现目标 / 成为更好的人].",
  sample:"As the famous saying goes, “Where there is a will, there is a way.” Simple as the remark may sound, it contains abundant life philosophy and tells us that a strong will is the key to success.\n\nThere is no denying that difficulties are unavoidable in our life. For example, when preparing for the CET-4, many students find it hard to memorize thousands of words, and some of them even want to give up.\n\nMoreover, a strong will can turn failure into success. Take my roommate as an example, she failed the exam last term, but she kept practicing every day and finally got a high score.\n\nTo sum up, we should always keep the saying in mind. Only by doing so can we overcome any obstacle and achieve our goals.",
  patterns:"As the famous saying goes, “...”\nSimple as the remark may sound, it contains abundant life philosophy.\nThere is no denying that ...\nTake ... as an example, ...\nOnly by doing so can we ...",
  keywords:"saying 格言 / remark 话语 / philosophy 哲理 / no denying 不可否认 / obstacle 障碍 / achieve goals 实现目标",
  pitfalls:"名言务必写准，写错会直接降档；必须解释名言与主题的关联，不能只翻译名言。"},
 {id:"W9", cat:"议论文", icon:"📝", title:"现象评论型（Phenomenon Comment）",
  desc:"对热点现象发表看法：描述现象 → 分析成因/影响 → 表明态度。",
  skeleton:"开头段：Recently, [现象] has become increasingly popular / has aroused wide concern among [群体].\n\n主体段1（成因或影响）：The reasons are as follows. First, [原因一]. Second, [原因二].\n\n主体段2（态度）：As far as I am concerned, its advantages outweigh its disadvantages / we should view it in a rational way, because [理由].\n\n结尾段：In conclusion, [总结观点]. It is high time that we [呼吁行动].",
  sample:"Recently, short videos have become increasingly popular among young people, which has aroused wide concern.\n\nThe reasons are as follows. First, they are short and entertaining, so people can relax in a few minutes. Second, almost everyone can produce a video with a smart phone, which greatly lowers the cost of creation.\n\nAs far as I am concerned, we should view them in a rational way. On the one hand, some videos teach useful knowledge and skills. On the other hand, watching them for hours wastes our time and does harm to our eyesight.\n\nIn conclusion, short videos are a double-edged sword. It is high time that we made good use of them instead of being controlled by them.",
  patterns:"Recently, ... has become increasingly popular among ...\nThe reasons are as follows.\nAs far as I am concerned, ...\nIt is high time that we ...（虚拟语气加分）\n... is a double-edged sword",
  keywords:"increasingly 越来越 / rational 理性的 / outweigh 超过 / double-edged sword 双刃剑 / make good use of 充分利用",
  pitfalls:"态度段不能只说好坏不举例；It is high time that 后接过去式（we made），别写错时态。"},
 {id:"W10", cat:"应用文", icon:"✉️", title:"感谢信（Letter of Thanks）",
  desc:"感谢他人的帮助/款待/礼物，格式与语气是得分点。",
  skeleton:"Dear [称呼],\n\nI am writing to express my sincere gratitude to you for [感谢的事：your help / your hospitality / the gift].\n\nWithout your help, I could not have [具体成果]. It was you who [对方具体做了什么], which made me feel [感受]. Besides, [补充细节].\n\nThank you again for your kindness, and I hope to have the chance to repay you.\n\nYours sincerely,\n[署名]",
  sample:"Dear Mr. Smith,\n\nI am writing to express my sincere gratitude to you for your generous help during my stay in London.\n\nWithout your help, I could not have finished my research so smoothly. It was you who spent several weekends showing me around the libraries and explaining the local culture to me, which made me feel at home in a strange city. Besides, the notes you lent me saved me a lot of time.\n\nThank you again for your kindness, and I hope to have the chance to repay you when you visit China.\n\nYours sincerely,\nLi Ming",
  patterns:"I am writing to express my sincere gratitude to you for ...\nWithout your help, I could not have ...\nIt was you who ...（强调句加分）\nThank you again for your kindness.",
  keywords:"gratitude 感激 / generous 慷慨的 / hospitality 款待 / repay 回报 / feel at home 宾至如归",
  pitfalls:"感谢信要写具体做了什么，泛泛而谈会丢分；结尾别忘 Yours sincerely + 署名。"},
 {id:"W11", cat:"应用文", icon:"✉️", title:"道歉信（Letter of Apology）",
  desc:"因失约/损坏物品/未完成任务道歉，需要说明原因并提出补救。",
  skeleton:"Dear [称呼],\n\nI am writing to make an apology to you for [道歉事由：not being able to ... / my carelessness].\n\nThe reason is that [具体原因]. I am afraid that it has caused you much trouble. To make up for it, I would like to [补救措施：reschedule the meeting / buy you a new one]. Please let me know if it is convenient for you.\n\nOnce again, I am sorry for any inconvenience caused. I am looking forward to your reply.\n\nYours sincerely,\n[署名]",
  sample:"Dear Professor Brown,\n\nI am writing to make an apology to you for not being able to attend your lecture yesterday afternoon.\n\nThe reason is that I suddenly had a high fever yesterday morning and the doctor asked me to stay in bed. I am afraid that it has caused you much trouble. To make up for it, I would like to borrow the notes from my classmate and hand in my homework next Monday. Please let me know if it is convenient for you.\n\nOnce again, I am sorry for any inconvenience caused. I am looking forward to your reply.\n\nYours sincerely,\nLi Ming",
  patterns:"I am writing to make an apology to you for ...\nThe reason is that ...\nTo make up for it, I would like to ...\nI am sorry for any inconvenience caused.",
  keywords:"apology 道歉 / make up for 弥补 / inconvenience 不便 / reschedule 改期 / be grateful 感激",
  pitfalls:"原因要真实具体（病假/突发情况），不能敷衍；必须有补救方案，否则显得不诚恳。"},
 {id:"W12", cat:"应用文", icon:"✉️", title:"投诉信（Letter of Complaint）",
  desc:"对商品或服务表达不满，要求解决；语气要坚定但不失礼貌。",
  skeleton:"Dear Sir or Madam,\n\nI am writing to express my dissatisfaction with [投诉对象：the product / the service] that I bought from your store on [日期].\n\nTo begin with, [问题一：it did not work properly / the quality is poor]. What is worse, [问题二]. I have tried to contact your staff, but [结果].\n\nTherefore, I would like you to [要求：change it for a new one / give me a full refund]. I hope you can deal with it as soon as possible.\n\nYours faithfully,\n[署名]",
  sample:"Dear Sir or Madam,\n\nI am writing to express my dissatisfaction with the mobile phone that I bought from your online store on June 1st.\n\nTo begin with, the battery can only last for three hours, which is far from what you promised in the advertisement. What is worse, the screen sometimes goes black when I am making a call. I have tried to contact your after-sale service, but nobody answered the phone.\n\nTherefore, I would like you to either change it for a new one or give me a full refund. I hope you can deal with it as soon as possible.\n\nYours faithfully,\nLi Ming",
  patterns:"I am writing to express my dissatisfaction with ...\nTo begin with, ... What is worse, ...\nI would like you to either ... or ...\nI hope you can deal with it as soon as possible.",
  keywords:"dissatisfaction 不满 / refund 退款 / after-sale service 售后服务 / promise 承诺 / deal with 处理",
  pitfalls:"投诉信不要用辱骂性词语；诉求要具体（换新/全额退款/维修），并给出订单信息增强可信度。"},
 {id:"W13", cat:"应用文", icon:"✉️", title:"申请 / 求职信（Application Letter）",
  desc:"申请职位、奖学金或社团：说明来意 → 展示优势 → 表达期待。",
  skeleton:"Dear Sir or Madam,\n\nI am writing to apply for [position / scholarship / membership], which I saw advertised on [信息来源].\n\nI believe I am qualified for it. First of all, I major in [专业] and have a good command of [技能]. Besides, I once worked as [经历], from which I gained rich experience in [相关领域]. Last but not least, I am outgoing and good at communicating with others.\n\nI would appreciate it if you could give me an interview. Thank you for your time and consideration.\n\nYours sincerely,\n[署名]",
  sample:"Dear Sir or Madam,\n\nI am writing to apply for the position of part-time English editor, which I saw advertised on your website.\n\nI believe I am qualified for it. First of all, I major in English and have a good command of both written and spoken English. Besides, I once worked as a reporter for the school newspaper for two years, from which I gained rich experience in writing and editing. Last but not least, I am outgoing and good at communicating with others, which helps me work well in a team.\n\nI have enclosed my resume with this letter. I would appreciate it if you could give me an interview.\n\nYours sincerely,\nLi Ming",
  patterns:"I am writing to apply for ..., which I saw advertised on ...\nI believe I am qualified for it.\nI have a good command of ...\nI would appreciate it if you could ...",
  keywords:"apply for 申请 / qualified 有资格的 / have a good command of 精通 / enclose 随信附上 / resume 简历",
  pitfalls:"优势要用事实支撑（专业、经历、证书），不要只写 I am hard-working；结尾感谢对方考虑。"},
 {id:"W14", cat:"应用文", icon:"🎤", title:"演讲稿（Speech）",
  desc:"在场合发表讲话（开学典礼、比赛、班会），开头要与听众互动。",
  skeleton:"Good morning, everyone. / Dear friends,\n\nIt is a great honor for me to stand here and deliver a speech on [主题].\n\nAs we all know, [背景或重要性]. However, [现状问题]. Therefore, I would like to share some suggestions with you. First, [建议一]. Second, [建议二].\n\nDear friends, let us take action from now on. I am sure that [展望]. Thank you for listening!",
  sample:"Good morning, everyone.\n\nIt is a great honor for me to stand here and deliver a speech on the importance of reading.\n\nAs we all know, reading is one of the best ways to gain knowledge and broaden our horizons. However, with the popularity of smart phones, many students spend hours on short videos every day and seldom open a book. Therefore, I would like to share some suggestions with you. First, set aside half an hour for reading every day. Second, join a reading club so that you can share your ideas with others.\n\nDear friends, let us take action from now on. I am sure that reading will make our life richer and our future brighter. Thank you for listening!",
  patterns:"It is a great honor for me to stand here and deliver a speech on ...\nAs we all know, ...\nI would like to share some suggestions with you.\nThank you for listening!",
  keywords:"deliver a speech 发表演讲 / honor 荣幸 / broaden horizons 开阔眼界 / set aside 留出 / take action 行动",
  pitfalls:"演讲稿要有称呼与致谢（Thank you for listening）；多用 we / let us 拉近与听众的距离。"},
 {id:"W15", cat:"应用文", icon:"📣", title:"倡议书（Proposal）",
  desc:"号召大家参与某项活动（环保、阅读、志愿服务），重在号召力。",
  skeleton:"Dear fellow students,\n\nNowadays, [背景现象], which has caused serious problems. Therefore, I am writing to call on everyone to [倡议内容].\n\nThere are many things we can do. To begin with, [做法一]. Besides, [做法二]. Most importantly, [做法三].\n\nMy dear friends, every small effort counts. Let us work together to [目标].\n\n[署名 / 组织名]",
  sample:"Dear fellow students,\n\nNowadays, a large amount of food is wasted in our school canteen every day, which has caused serious problems. Therefore, I am writing to call on everyone to save food.\n\nThere are many things we can do. To begin with, we should order only what we can finish. Besides, we can take the leftovers away instead of throwing them into the bin. Most importantly, we should tell our friends and family how important it is to treasure grain.\n\nMy dear friends, every small effort counts. Let us work together to build a greener campus.\n\nThe Student Union",
  patterns:"I am writing to call on everyone to ...\nThere are many things we can do.\nEvery small effort counts.\nLet us work together to ...",
  keywords:"call on 号召 / leftover 剩饭菜 / treasure 珍惜 / effort 努力 / sustainable 可持续的",
  pitfalls:"倡议书要给出可执行的做法（3 条左右），结尾要有号召句；落款可用 Student Union。"},
 {id:"W16", cat:"应用文", icon:"📰", title:"新闻报道（News Report）",
  desc:"报道校园活动/事件，采用第三人称与过去时，客观简洁。",
  skeleton:"[标题 / 导语]\n\nOn [时间], [活动名称] was held in [地点], which attracted [参与者].\n\nAccording to [信息来源], [具体经过一]. Besides, [具体经过二]. Many students said that they [参与者反馈].\n\nThis activity not only [意义一], but also [意义二]. It is reported that more activities of this kind will be organized in the future.",
  sample:"A Charity Sale for Mountain Children\n\nOn the afternoon of June 10th, a charity sale was held on the school playground, which attracted more than three hundred students.\n\nAccording to the organizer, over five hundred second-hand books and toys were collected in advance and sold at low prices. Besides, some students gave wonderful performances to draw attention. Many students said that they were glad to do something meaningful for the children in mountain areas.\n\nThis activity not only raised more than two thousand yuan for the children, but also strengthened students sense of social responsibility. It is reported that more activities of this kind will be organized in the future.",
  patterns:"On [date], ... was held in ..., which attracted ...\nAccording to ..., ...\nThis activity not only ..., but also ...\nIt is reported that ...",
  keywords:"charity 慈善 / attract 吸引 / organizer 组织者 / raise money 筹款 / social responsibility 社会责任",
  pitfalls:"新闻报道用第三人称与过去时，不要出现 I/we；必须有时间、地点、人物与结果要素。"},
 {id:"W17", cat:"图表作文", icon:"📊", title:"饼图 / 表格（占比描述）",
  desc:"描述各部分占比并分析原因：抓最大值与最小值，避免罗列所有数据。",
  skeleton:"开头段：The pie chart / table above shows [图表主题]. According to the data, [最大项] accounts for the largest proportion, while [最小项] makes up the smallest.\n\n主体段1：To be specific, [数据一] takes up [比例], which is followed by [数据二] at [比例]. This indicates that [结论].\n\n主体段2：Several factors may account for this situation. First, [原因一]. In addition, [原因二].\n\n结尾段：In conclusion, [总结]. It is expected that [趋势预测].",
  sample:"The pie chart above shows how Chinese college students spend their monthly pocket money. According to the data, food accounts for the largest proportion, while books make up the smallest.\n\nTo be specific, food takes up forty-five percent of the total, which is followed by clothing at twenty-five percent. Surprisingly, only eight percent is spent on books and learning materials. This indicates that many students pay more attention to their daily life than to their studies.\n\nSeveral factors may account for this situation. First, the price of meals has risen in recent years. In addition, young people care more about their appearance than before.\n\nIn conclusion, students should learn to manage their money wisely. It is expected that more of them will invest in their education in the future.",
  patterns:"The pie chart / table above shows ...\n... accounts for the largest proportion, while ... makes up the smallest.\n... takes up [数字] percent of the total.\nSeveral factors may account for this situation.",
  keywords:"account for 占（比例）/ proportion 比例 / take up 占据 / indicate 表明 / invest in 投资于",

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtDur(s){
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  const p = n => String(n).padStart(2,'0');
  return (h > 0 ? h + ':' : '') + p(m) + ':' + p(x);
}

const STORE_KEY = 'cet4_workbench_v1';
function defaultDB(){
  return {
    words: WORDS_DATA.map((w,i) => ({id:'s' + i + uid(), word:w.word, phonetic:w.phonetic, meaning:w.meaning, freq:w.freq, mastery:0, addedAt:todayStr()})),
    records: [],
    study: {},
    dailyWords: {},
    exam: null,
    examRecords: [],
    importedPapers: [],
    specStats: {vocab:{done:0,ok:0,total:0}, dictation:{done:0,ok:0,total:0}, translation:{done:0,ok:0,total:0}},
    specSeen: {vocab:[], dictation:[], translation:[]},
    writingStats: {count:0, sum:0, total:0},
    drafts: [],
    timerRunning: false,
    timerSecs: 0
  };
}
let DB = null;
function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ DB = JSON.parse(raw); if(!DB.words || !DB.records || !DB.study) throw 0; mergeSeedWords(); return; }
  }catch(e){}
  DB = defaultDB(); saveDB();
}
function saveDB(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){} }
/* 词库升级合并：补入新词，并给已有词补充例句/音标/词组字段，保留用户标记 */
function mergeSeedWords(){
  if(!DB.dailyWords) DB.dailyWords = {};
  if(!DB.examRecords) DB.examRecords = [];
  if(!DB.importedPapers) DB.importedPapers = [];
  if(!DB.specStats) DB.specStats = {vocab:{done:0,ok:0,total:0}, dictation:{done:0,ok:0,total:0}, translation:{done:0,ok:0,total:0}};
  if(!DB.specSeen) DB.specSeen = {vocab:[], dictation:[], translation:[]};
  if(!DB.writingStats) DB.writingStats = {count:0, sum:0, total:0};
  if(!DB.drafts) DB.drafts = [];
  const idx = new Map(DB.words.map(w => [w.word.toLowerCase(), w]));
  let added = 0, upgraded = 0;
  for(const w of WORDS_DATA){
    const key = w.word.toLowerCase();
    const exist = idx.get(key);
    if(exist){
      if((!exist.us && !exist.uk) && (w.us || w.uk)){ exist.us = w.us; exist.uk = w.uk; upgraded++; }
      if(!exist.phonetic && w.phonetic) exist.phonetic = w.phonetic;
      if(!exist.example && w.example){ exist.example = w.example; exist.exampleCn = w.exampleCn; upgraded++; }
      if(!exist.phrases && w.phrases) exist.phrases = w.phrases;
    }else{
      DB.words.push({id: uid(), word:w.word, phonetic:w.phonetic, us:w.us, uk:w.uk, meaning:w.meaning, freq:w.freq, phrases:w.phrases, example:w.example, exampleCn:w.exampleCn, mastery:0, addedAt:todayStr()});
      idx.set(key, null); added++;
    }
  }
  if(added || upgraded) saveDB();
  return added;
}

  else if(v === 'writing') renderWriting();

  else if(v === 'bank') renderBank();
  else if(v === 'spec') renderSpec();
  window.scrollTo(0, 0);
}

/* ================= 学习统计 ================= */
function accuracy(type){
  const rs = type === 'all' ? DB.records : DB.records.filter(r => r.type === type);
  if(!rs.length) return 0;
  const c = rs.reduce((s,r) => s + r.correct, 0), t = rs.reduce((s,r) => s + r.total, 0);
  return Math.round(c / t * 100);
}
function calcStreak(){
  let streak = 0; const now = new Date();
  for(let i = 0; i < 365; i++){
    const d = new Date(now); d.setDate(now.getDate() - i);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if((DB.study[key] || 0) >= 60) streak++; else break;
  }
  return streak;
}
function weekChart(){
  const days = []; const now = new Date();
  for(let i = 6; i >= 0; i--){
    const d = new Date(now); d.setDate(now.getDate() - i);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const mins = Math.round((DB.study[key] || 0) / 60);
    days.push({label: i === 0 ? '今天' : (d.getMonth()+1) + '/' + d.getDate(), mins});
  }
  const max = Math.max(1, ...days.map(x => x.mins));
  return '<div class="chart-wrap">' + days.map(x => {
    const h = Math.round(x.mins / max * 100);
    return '<div class="bar-col"><div class="bar-val">' + (x.mins || '') + '</div><div class="bar" style="height:' + Math.max(x.mins > 0 ? 5 : 0, h) + '%"></div><div class="bar-label">' + x.label + '</div></div>';
  }).join('') + '</div>';
}
function ring(label, pct, color){
  const c = 2 * Math.PI * 42;
  return '<div class="ring-item"><div class="ring"><svg width="96" height="96" viewBox="0 0 96 96">' +
    '<circle cx="48" cy="48" r="42" fill="none" stroke="#262A31" stroke-width="9"/>' +
    '<circle cx="48" cy="48" r="42" fill="none" stroke="' + color + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (pct/100*c).toFixed(1) + ' ' + c.toFixed(1) + '"/></svg>' +
    '<div class="ring-text"><b>' + pct + '%</b><span>' + label + '</span></div></div></div>';
}
function recList(){
  const rs = [...DB.records].reverse().slice(0, 8);
  if(!rs.length) return '<div class="rec-empty">还没有做题记录，去「听力 / 阅读」模块练一练吧～</div>';
  const nm = {listening:'🎧 听力', reading:'📄 阅读', writing:'✍️ 写作'};
  return '<div class="rec-list">' + rs.map(r => {
    const ok = r.total > 0 && r.correct / r.total >= 0.6;
    return '<div class="rec-item"><span class="rtype">' + (nm[r.type] || r.type) + '</span><span>' + r.date + '</span><span class="badge ' + (ok ? 'badge-green' : 'badge-orange') + '">' + r.correct + ' / ' + r.total + '</span></div>';
  }).join('') + '</div>';
}
